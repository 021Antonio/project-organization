
<style>

<script>
const RANK_ORDER=['E','D','C','B','A','S','S+'];
const RANK_XP={E:10,D:20,C:40,B:80,A:160,S:320,'S+':500};
const RANK_THRESHOLDS=[0,50,150,350,750,1500,3000,6000];
const RANK_NAMES=['E','D','C','B','A','S','S+'];
const RANK_STYLES={
  'S+':{bg:'#f0e0ff',color:'#5a0a9f',border:'#c080f0'},
  'S':{bg:'#ffecec',color:'#8a1a1a',border:'#f0a0a0'},
  'A':{bg:'#e0eaff',color:'#1a4aaf',border:'#aac0ef'},
  'B':{bg:'#fff3dc',color:'#7a4a00',border:'#e0b860'},
  'C':{bg:'#fff3dc',color:'#9a6a00',border:'#d4a840'},
  'D':{bg:'#e8f5dc',color:'#2a5a0a',border:'#90c860'},
  'E':{bg:'#f0f0f0',color:'#4a4a5a',border:'#c0c0d0'},
};
const TAG_CLASSES=['tag-blue','tag-purple','tag-teal','tag-amber','tag-coral','tag-red','tag-green','tag-pink'];
const tagColorMap={};let tagColorIdx=0;
function tagClass(t){if(!tagColorMap[t])tagColorMap[t]=TAG_CLASSES[tagColorIdx++%TAG_CLASSES.length];return tagColorMap[t];}

let quests=[];
let totalXP=0;
let editingId=null;
let deletingId=null;
let activationMode='now';

let dragId=null;
let dragOverCol=null;
let placeholder=null;

function nowMs(){return Date.now();}
function fmtDt(d){return new Date(d).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}
function fmtCountdown(dlMs){
  const diff=dlMs-nowMs();
  if(diff<0)return'VENCEU';
  const h=Math.floor(diff/3600000);
  if(h<24)return h+'h '+Math.floor((diff%3600000)/60000)+'m';
  return Math.floor(h/24)+'d '+Math.floor(h%24)+'h';
}
function timerInfo(q){
  if(!q.deadline)return{pct:100,label:'SEM PRAZO',cls:''};
  const created=new Date(q.createdAt).getTime();
  const dl=new Date(q.deadline).getTime();
  const total=dl-created;
  const remaining=dl-nowMs();
  if(remaining<=0)return{pct:0,label:'VENCEU',cls:'danger'};
  const pct=Math.max(0,Math.min(100,Math.round(remaining/total*100)));
  return{pct,label:fmtCountdown(dl),cls:pct<15?'danger':pct<35?'warn':''};
}
function timerBarColor(pct){return pct>50?'#4a70df':pct>20?'#d4a030':'#e03a1a';}
function getPlayerRank(xp){for(let i=RANK_THRESHOLDS.length-1;i>=0;i--)if(xp>=RANK_THRESHOLDS[i])return{rank:RANK_NAMES[Math.min(i,RANK_NAMES.length-1)],idx:Math.min(i,RANK_NAMES.length-1)};return{rank:'E',idx:0};}
function getXPpct(xp){const{idx}=getPlayerRank(xp);if(idx>=RANK_NAMES.length-1)return{pct:100,cur:xp,next:xp};const cur=RANK_THRESHOLDS[idx];const next=RANK_THRESHOLDS[idx+1];return{pct:Math.round((xp-cur)/(next-cur)*100),cur:xp-cur,next:next-cur};}
function calcXPGain(q){
  const base=RANK_XP[q.rank]||10;
  if(!q.deadline)return base;
  const created=new Date(q.createdAt).getTime();
  const dl=new Date(q.deadline).getTime();
  const total=dl-created;
  const remaining=dl-nowMs();
  const ratio=remaining/total;
  if(remaining<0)return -Math.round(base*0.5);
  if(ratio>0.5)return base;
  if(ratio>0.1)return Math.round(base*(0.2+ratio*1.6));
  return Math.round(base*0.2);
}

function renderRankPill(rank){const s=RANK_STYLES[rank]||RANK_STYLES.E;return`<span class="rank-pill" style="background:${s.bg};color:${s.color};border:1px solid ${s.border}">${rank}</span>`;}

function buildCardHTML(q){
  const tInfo=timerInfo(q);
  const isOverdue=q.deadline&&new Date(q.deadline)<new Date()&&q.status==='active';
  const cls=q.status==='active'?(isOverdue?'card overdue':(tInfo.pct<15?'card urgent':'card')):q.status==='cleared'?'card done':q.status==='scheduled'?'card scheduled':'card';
  const tags=(q.tags||[]).map(t=>`<span class="ctag ${tagClass(t)}">${t}</span>`).join('');
  const timerHTML=q.status==='active'&&q.deadline?`<div class="timer-block"><div class="timer-bar-wrap"><div class="timer-bar" id="tbar-${q.id}" style="width:${tInfo.pct}%;background:${timerBarColor(tInfo.pct)}"></div></div><div class="timer-label ${tInfo.cls}"><span id="tlbl-${q.id}">${tInfo.label}</span><span>${fmtDt(q.deadline)}</span></div></div>`:'';
  const schedHTML=q.status==='scheduled'&&q.activateAt?`<div class="scheduled-label"><i class="ti ti-clock" style="font-size:10px" aria-hidden="true"></i>ATIVA EM: ${fmtDt(q.activateAt)}</div>`:'';
  const completeBtn=q.status==='active'?`<button class="act-btn complete" title="Concluir" onclick="completeQuest('${q.id}')"><i class="ti ti-check" aria-hidden="true"></i></button>`:'';
  const dueFooter=q.deadline&&q.status!=='active'?`<span class="cdue" style="margin-left:auto"><i class="ti ti-calendar" style="font-size:9px" aria-hidden="true"></i>${fmtDt(q.deadline)}</span>`:'';
  return`<div class="${cls}" id="card-${q.id}" data-id="${q.id}" draggable="true">
    <div class="card-head">
      <span class="card-title">${q.title}</span>
      <div class="card-actions">
        ${completeBtn}
        <button class="act-btn edit" title="Editar" onclick="openEdit('${q.id}')"><i class="ti ti-edit" aria-hidden="true"></i></button>
        <button class="act-btn archive" title="Arquivar" onclick="archiveQuest('${q.id}')"><i class="ti ti-archive" aria-hidden="true"></i></button>
        <button class="act-btn del" title="Apagar" onclick="confirmDelete('${q.id}')"><i class="ti ti-trash" aria-hidden="true"></i></button>
      </div>
      ${renderRankPill(q.rank)}
    </div>
    ${schedHTML}
    ${q.desc?`<p class="card-desc">${q.desc}</p>`:''}
    ${timerHTML}
    <div class="card-foot">${tags}${dueFooter}</div>
  </div>`;
}

function sortActive(list){
  const ro=Object.fromEntries(RANK_ORDER.map((r,i)=>[r,i]));
  return list.slice().sort((a,b)=>{
    const ri=(ro[b.rank]||0)-(ro[a.rank]||0);
    if(ri!==0)return ri;
    if(a.deadline&&b.deadline)return new Date(a.deadline)-new Date(b.deadline);
    if(a.deadline)return -1;if(b.deadline)return 1;return 0;
  });
}

function renderBoard(){
  const pending=quests.filter(q=>q.status==='pending'||q.status==='scheduled');
  const active=sortActive(quests.filter(q=>q.status==='active'));
  const cleared=quests.filter(q=>q.status==='cleared');

  ['pending','active','cleared'].forEach(col=>{
    const list=col==='pending'?pending:col==='active'?active:cleared;
    const zone=document.getElementById('col-'+col);
    zone.innerHTML=list.map(buildCardHTML).join('');
    document.getElementById('cnt-'+col).textContent=String(list.length).padStart(2,'0');
  });

  bindDrag();

  const urgentCount=quests.filter(q=>q.status==='active'&&q.deadline&&(new Date(q.deadline)-new Date())<86400000&&new Date(q.deadline)>new Date()).length;
  const overdueCount=quests.filter(q=>q.status==='active'&&q.deadline&&new Date(q.deadline)<new Date()).length;
  const alertN=urgentCount+overdueCount;
  const ab=document.getElementById('alert-box');
  if(alertN>0){ab.style.display='flex';document.getElementById('alert-txt').textContent=alertN+' URGENT';}else ab.style.display='none';

  document.getElementById('s-total').textContent=quests.filter(q=>q.status!=='archived').length;
  document.getElementById('s-active').textContent=active.length;
  document.getElementById('s-cleared').textContent=cleared.length;
  document.getElementById('s-overdue').textContent=overdueCount;
  document.getElementById('s-xp').textContent=totalXP;

  const{rank}=getPlayerRank(totalXP);
  const{pct,cur,next}=getXPpct(totalXP);
  document.getElementById('xp-bar').style.width=pct+'%';
  document.getElementById('xp-pct-lbl').textContent=cur+' / '+next+' XP';
  const rb=document.getElementById('rank-lbl');
  rb.textContent='RANK '+rank;
  const rs=RANK_STYLES[rank]||RANK_STYLES.E;
  rb.style.background=rs.bg;rb.style.color=rs.color;rb.style.border='1px solid '+rs.border;
}

function bindDrag(){
  document.querySelectorAll('.card[draggable]').forEach(card=>{
    card.addEventListener('dragstart',onDragStart);
    card.addEventListener('dragend',onDragEnd);
  });
  document.querySelectorAll('.drop-zone').forEach(zone=>{
    zone.addEventListener('dragover',onDragOver);
    zone.addEventListener('dragleave',onDragLeave);
    zone.addEventListener('drop',onDrop);
  });
}

function onDragStart(e){
  dragId=this.dataset.id;
  this.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain',dragId);
}

function onDragEnd(){
  this.classList.remove('dragging');
  document.querySelectorAll('.drop-zone').forEach(z=>z.classList.remove('drag-over'));
  if(placeholder&&placeholder.parentNode)placeholder.parentNode.removeChild(placeholder);
  placeholder=null;dragId=null;dragOverCol=null;
}

function onDragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  const zone=this;
  zone.classList.add('drag-over');
  dragOverCol=zone.dataset.col;

  if(!placeholder){
    placeholder=document.createElement('div');
    placeholder.className='card drag-placeholder';
    placeholder.style.height='44px';
  }

  const afterEl=getDragAfterElement(zone,e.clientY);
  if(afterEl==null){zone.appendChild(placeholder);}
  else{zone.insertBefore(placeholder,afterEl);}
}

function onDragLeave(e){
  if(!this.contains(e.relatedTarget)){
    this.classList.remove('drag-over');
    if(placeholder&&placeholder.parentNode===this)this.removeChild(placeholder);
  }
}

function getDragAfterElement(zone,y){
  const els=[...zone.querySelectorAll('.card:not(.dragging):not(.drag-placeholder)')];
  return els.reduce((closest,child)=>{
    const box=child.getBoundingClientRect();
    const offset=y-box.top-box.height/2;
    if(offset<0&&offset>closest.offset)return{offset,element:child};
    return closest;
  },{offset:Number.NEGATIVE_INFINITY}).element;
}

function onDrop(e){
  e.preventDefault();
  const zone=this;
  zone.classList.remove('drag-over');
  if(placeholder&&placeholder.parentNode)placeholder.parentNode.removeChild(placeholder);
  placeholder=null;

  const targetCol=zone.dataset.col;
  if(!dragId||!targetCol)return;

  const q=quests.find(x=>x.id===dragId);
  if(!q)return;

  const prevStatus=q.status;
  let newStatus=targetCol;

  if(targetCol==='pending')newStatus='pending';
  else if(targetCol==='active')newStatus='active';
  else if(targetCol==='cleared')newStatus='cleared';

  if(newStatus===prevStatus){renderBoard();return;}

  if(newStatus==='cleared'&&prevStatus!=='cleared'){
    const xp=calcXPGain(q);
    q.status='cleared';q.clearedAt=new Date().toISOString();
    totalXP=Math.max(0,totalXP+xp);
    const cardEl=document.getElementById('card-'+dragId);
    if(cardEl)showXPPopup(cardEl,xp);
    showToast((xp>=0?'+':'')+xp+' XP — QUEST CLEARED!',xp>=0?'success':'warning');
  } else if(newStatus==='active'&&prevStatus==='cleared'){
    q.status='active';q.clearedAt=null;
    showToast('QUEST REATIVADA','info');
  } else if(newStatus==='pending'&&prevStatus==='cleared'){
    q.status='pending';q.clearedAt=null;
    showToast('QUEST MOVIDA PARA PENDING','info');
  } else if(newStatus==='active'&&prevStatus==='pending'){
    q.status='active';
    showToast('QUEST ATIVADA','info');
  } else {
    q.status=newStatus;
    showToast('QUEST MOVIDA','info');
  }

  renderBoard();
}

function showXPPopup(cardEl,xpVal){
  const pop=document.createElement('div');
  pop.className='xp-popup';
  pop.textContent=(xpVal>=0?'+':'')+xpVal+' XP';
  pop.style.color=xpVal>=0?'#0a6a46':'#8a1a1a';
  pop.style.background=xpVal>=0?'#e0f5ee':'#ffecec';
  pop.style.border='1px solid '+(xpVal>=0?'#8ad4b8':'#f0a0a0');
  const rect=cardEl.getBoundingClientRect();
  const appRect=document.getElementById('app').getBoundingClientRect();
  pop.style.top=(rect.top-appRect.top-30)+'px';
  pop.style.left=(rect.left-appRect.left+rect.width/2-30)+'px';
  document.getElementById('app').appendChild(pop);
  setTimeout(()=>{pop.style.opacity='1';pop.style.transform='translateY(-10px)';},10);
  setTimeout(()=>{pop.style.opacity='0';},900);
  setTimeout(()=>{pop.remove();},1300);
}

function showToast(msg,type){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast show '+type;
  setTimeout(()=>{t.className='toast';},2500);
}

function completeQuest(id){
  const q=quests.find(x=>x.id===id);if(!q)return;
  const xp=calcXPGain(q);
  q.status='cleared';q.clearedAt=new Date().toISOString();
  totalXP=Math.max(0,totalXP+xp);
  const cardEl=document.getElementById('card-'+id);
  if(cardEl)showXPPopup(cardEl,xp);
  renderBoard();
  showToast((xp>=0?'+':'')+xp+' XP — QUEST CLEARED!',xp>=0?'success':'warning');
}

function archiveQuest(id){const q=quests.find(x=>x.id===id);if(!q)return;q.status='archived';renderBoard();showToast('QUEST ARQUIVADA','warning');}
function confirmDelete(id){deletingId=id;document.getElementById('confirm-overlay').classList.add('open');}
function closeConfirm(){document.getElementById('confirm-overlay').classList.remove('open');deletingId=null;}
function doDelete(){quests=quests.filter(q=>q.id!==deletingId);closeConfirm();renderBoard();showToast('QUEST REMOVIDA','danger');}

function setActivation(mode){
  activationMode=mode;
  document.getElementById('topt-now').classList.toggle('active',mode==='now');
  document.getElementById('topt-sched').classList.toggle('active',mode==='sched');
  document.getElementById('sched-fields').classList.toggle('show',mode==='sched');
}

function openCreate(){
  editingId=null;
  document.getElementById('modal-sys-lbl').textContent='NEW QUEST';
  document.getElementById('modal-title-lbl').textContent='CREATE QUEST';
  document.getElementById('f-title').value='';
  document.getElementById('f-desc').value='';
  document.getElementById('f-rank').value='B';
  document.getElementById('f-tags').value='';
  document.getElementById('f-deadline').value='';
  document.getElementById('f-activeat').value='';
  setActivation('now');
  document.getElementById('edit-overlay').classList.add('open');
}

function openEdit(id){
  const q=quests.find(x=>x.id===id);if(!q)return;
  editingId=id;
  document.getElementById('modal-sys-lbl').textContent='QUEST EDITOR';
  document.getElementById('modal-title-lbl').textContent='EDIT QUEST';
  document.getElementById('f-title').value=q.title;
  document.getElementById('f-desc').value=q.desc||'';
  document.getElementById('f-rank').value=q.rank;
  document.getElementById('f-tags').value=(q.tags||[]).join(', ');
  document.getElementById('f-deadline').value=q.deadline?new Date(q.deadline).toISOString().slice(0,16):'';
  document.getElementById('f-activeat').value=q.activateAt?new Date(q.activateAt).toISOString().slice(0,16):'';
  setActivation(q.activateAt?'sched':'now');
  document.getElementById('edit-overlay').classList.add('open');
}

function closeModal(){document.getElementById('edit-overlay').classList.remove('open');editingId=null;}

function saveQuest(){
  const title=document.getElementById('f-title').value.trim();
  if(!title){showToast('TÍTULO OBRIGATÓRIO','danger');return;}
  const rank=document.getElementById('f-rank').value;
  const desc=document.getElementById('f-desc').value.trim();
  const tags=document.getElementById('f-tags').value.split(',').map(t=>t.trim()).filter(Boolean);
  const dlVal=document.getElementById('f-deadline').value;
  const deadline=dlVal?new Date(dlVal).toISOString():null;
  const acVal=document.getElementById('f-activeat').value;
  const activateAt=(activationMode==='sched'&&acVal)?new Date(acVal).toISOString():null;
  if(editingId){
    const q=quests.find(x=>x.id===editingId);
    if(q){q.title=title;q.desc=desc;q.rank=rank;q.tags=tags;q.deadline=deadline;q.activateAt=activateAt;}
    showToast('QUEST ATUALIZADA','success');
  } else {
    const status=activationMode==='sched'&&activateAt?'scheduled':'active';
    quests.push({id:'q'+Date.now(),title,desc,rank,tags,deadline,activateAt,status,createdAt:new Date().toISOString()});
    showToast('QUEST CRIADA','success');
  }
  closeModal();renderBoard();
}

document.getElementById('edit-overlay').addEventListener('click',function(e){if(e.target===this)closeModal();});
document.getElementById('confirm-overlay').addEventListener('click',function(e){if(e.target===this)closeConfirm();});
document.querySelectorAll('.npill').forEach(p=>{p.addEventListener('click',function(){document.querySelectorAll('.npill').forEach(x=>x.classList.remove('active'));this.classList.add('active');});});

setInterval(()=>{
  quests.filter(q=>q.status==='active'&&q.deadline).forEach(q=>{
    const t=timerInfo(q);
    const bar=document.getElementById('tbar-'+q.id);
    const lbl=document.getElementById('tlbl-'+q.id);
    if(bar){bar.style.width=t.pct+'%';bar.style.background=timerBarColor(t.pct);}
    if(lbl)lbl.textContent=t.label;

  quests.filter(q=>q.status==='scheduled'&&q.activateAt).forEach(q=>{
    if(new Date(q.activateAt)<=new Date()){q.status='active';showToast('QUEST ATIVADA: '+q.title,'info');renderBoard();}
  });
},10000);
